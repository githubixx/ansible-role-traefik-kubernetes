---
# This workflow requires a GALAXY_API_KEY secret present in the GitHub
# repository or organization.
#
# See: https://github.com/marketplace/actions/publish-ansible-role-to-galaxy
# See: https://github.com/ansible/galaxy/issues/46

name: Release
on:
  push:
    tags:
      - '*'

defaults:
  run:
    working-directory: 'githubixx.traefik_kubernetes'

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - name: Check out the codebase.
        uses: actions/checkout@v6
        with:
          path: 'githubixx.traefik_kubernetes'

      - name: Set up Python 3.
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Set up uv.
        uses: astral-sh/setup-uv@v6

      - name: Install Ansible.
        run: |
          uv venv --python 3.13
          uv pip install 'ansible-core>=2.19,<2.20'

      - name: Trigger a new import on Galaxy.
        env:
          GALAXY_API_KEY: ${{ secrets.GALAXY_API_KEY }}
        run: |
          source .venv/bin/activate
          repo="${GITHUB_REPOSITORY#*/}"
          role_name="${repo#ansible-role-}"
          role_name="${role_name/-/_}"
          ansible-galaxy role import --token "$GALAXY_API_KEY" -vvvvvvvv \
            --role-name="$role_name" "${GITHUB_REPOSITORY%/*}" "$repo"
